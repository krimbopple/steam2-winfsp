name: Cross-platform build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux:
    name: Linux build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libfuse3-dev libssl-dev qt6-base-dev qt6-base-dev-tools

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Test
        run: ctest --preset linux-release

      - name: Archive Linux package and write checksum
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/root/licenses
          cp out/build-linux/steam2fs dist/root/steam2fs
          cp out/build-linux/steam2gui dist/root/steam2gui
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/root/
          cp licenses/* dist/root/licenses/
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="ci-${GITHUB_SHA:0:12}"
          fi
          archive="steam2-winfsp-${version}-linux-x64.tar.gz"
          tar -C dist/root -czf "dist/$archive" .
          sha256sum "dist/$archive" | sed "s#dist/##" > "dist/$archive.sha256"
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Linux CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam2-winfsp-linux-x64
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build, test, and package
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Qt SDK
        shell: pwsh
        run: |
          $qtBase = Join-Path $env:RUNNER_TEMP "Qt"
          $qtRoot = Join-Path $qtBase "$env:QT_VERSION\msvc2022_64"
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --outputdir $qtBase
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset vs2022-x64

      - name: Build
        shell: pwsh
        run: cmake --build --preset vs2022-release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset vs2022-release

      - name: Create deployable Qt package
        shell: pwsh
        run: cmake --build out/build-vs2022 --config MinSizeRel --target package_gui

      - name: Archive Windows package and write checksum
        id: archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "ci-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          $archive = "steam2-winfsp-$version-win-x64.zip"
          Compress-Archive -Path "out/build-vs2022/package/MinSizeRel/*" -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline -Encoding ascii "dist/$archive.sha256"
          "archive=dist/$archive" >> $env:GITHUB_OUTPUT
          "checksum=dist/$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam2-winfsp-win-x64
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Download Linux release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steam2-winfsp-linux-x64
          path: dist-linux

      - name: Attest Windows release provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Attest Linux release provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-linux/*.tar.gz

      - name: Create GitHub release from CI artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem dist, dist-linux -File |
              Sort-Object FullName |
              ForEach-Object FullName
          )
          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
