name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      QT_VERSION: 6.8.3
      QT_ARCH: win64_msvc2022_64
      QT_ROOT: ${{ runner.temp }}\Qt\6.8.3\msvc2022_64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Qt SDK
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --outputdir "${{ runner.temp }}\Qt"

      - name: Configure
        shell: pwsh
        run: cmake --preset vs2022-x64

      - name: Build
        shell: pwsh
        run: cmake --build --preset vs2022-release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset vs2022-release

      - name: Create deployable Qt package
        shell: pwsh
        run: cmake --build out/build-vs2022 --config MinSizeRel --target package_gui

      - name: Archive package and write checksum
        id: archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "ci-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          $archive = "steam2-winfsp-$version-win-x64.zip"
          Compress-Archive -Path "out/build-vs2022/package/MinSizeRel/*" -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline -Encoding ascii "dist/$archive.sha256"
          "archive=dist/$archive" >> $env:GITHUB_OUTPUT
          "checksum=dist/$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam2-winfsp-win-x64
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Attest release build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.archive }}

      - name: Create GitHub release from CI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "${{ steps.archive.outputs.archive }}" `
            "${{ steps.archive.outputs.checksum }}" `
            --verify-tag `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
